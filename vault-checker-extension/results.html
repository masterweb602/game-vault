<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Checker — Results</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; background: #0f0f12; color: #f0ece4; line-height: 1.45;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .sub { font-size: 12px; color: #76716a; margin: 0 0 18px; }
  .meta { font-size: 12px; color: #9a948b; }

  button {
    appearance: none; border: 1px solid #2a2a31; background: #1c1c22; color: #f0ece4;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #24242c; }
  button.danger:hover { border-color: #f87171; color: #f87171; }
  button:disabled { opacity: .4; cursor: default; }

  .section { background: #16161b; border: 1px solid #2a2a31; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .sec-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #2a2a31; }
  .sec-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .sec-title { font-size: 14px; font-weight: 600; }
  .sec-count { font-size: 12px; color: #76716a; }
  .sec-actions { margin-left: auto; display: flex; gap: 8px; }

  .miss .sec-dot { background: #f87171; }
  .hit  .sec-dot { background: #4ade80; }
  .done .sec-dot { background: #38bdf8; }

  ul.list { list-style: none; margin: 0; padding: 4px 0; max-height: 60vh; overflow-y: auto; }
  li.item { display: flex; align-items: baseline; gap: 8px; padding: 6px 14px; border-top: 1px solid #1f1f25; }
  li.item:first-child { border-top: none; }
  .item a, .item .nm { color: #f0ece4; text-decoration: none; word-break: break-word; }
  .item a:hover { text-decoration: underline; }
  .item .db { color: #9a948b; font-size: 12px; }
  .empty { padding: 14px; color: #76716a; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Vault Checker — Results</h1>
      <button class="danger" id="clear-all" type="button">Clear all</button>
    </div>
    <p class="sub">Detected from auto-scan and manual selection. <span class="meta" id="meta"></span></p>

    <div class="section miss" id="sec-notInVault"></div>
    <div class="section hit" id="sec-inVault"></div>
    <div class="section done" id="sec-completed"></div>
  </div>

  <script src="results.js"></script>
</body>
</html>
